<app-bento-page [heading]="greeting() + ', ' + displayName() + '.'" [subtitle]="dateLine">
  <div bentoActions class="actions">
    <app-bento-segmented
      label="Dashboard view"
      [options]="roleOptions"
      [value]="role()"
      (selected)="onRoleSelected($event)"
    />
    <app-bento-segmented
      label="Date range"
      [options]="rangeOptions"
      [value]="range()"
      (selected)="onRangeSelected($event)"
    />
    @if (role() === 'producer') {
      <a class="cta" routerLink="/upload">
        <i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i> Upload beat
      </a>
    } @else {
      <a class="cta" routerLink="/explore">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Find beats
      </a>
    }
  </div>

  @if (role() === 'producer') {
    <app-bento-insights
      [data]="overview()"
      [state]="insightState()"
      [currency]="currency()"
      [periodLabel]="periodLabel()"
      [windowDays]="windowDays()"
      [topSpecs]="topSpecs()"
      rankBy="plays"
      rankHint="By plays"
      [gaugeHint]="'Last ' + windowDays() * 2 + ' days'"
      tilesLink="/studio/analytics"
      [animateKey]="animateKey()"
    />
  } @else {
    <app-bento-card
      heading="Spending"
      [hint]="periodLabel()"
      palette="blue"
      [span]="8"
      [spanMd]="12"
      [height]="376"
      [index]="0"
    >
      <div class="headline">
        <strong class="big">{{ series().total }}</strong>
        @if (series().up !== null) {
          <span class="chip">{{ series().delta }}</span>
        }
      </div>
      <app-bento-stream-chart
        [series]="spendStream()"
        [labels]="spendLabels()"
        [format]="moneyFormat"
        [animateKey]="animateKey()"
        [empty]="loading() ? 'Loading…' : 'No purchases in this period yet.'"
        ariaLabel="Spending over time"
      />
    </app-bento-card>

    <app-bento-card
      heading="Spend by license"
      palette="graphite"
      [span]="4"
      [spanMd]="12"
      [height]="376"
      [index]="1"
    >
      <app-bento-gauge
        [shares]="spendShares()"
        caption="Top license"
        [empty]="loading() ? 'Loading…' : 'No purchases yet.'"
      />
    </app-bento-card>

    <app-bento-stat-tile
      label="Spent"
      icon="fa-solid fa-wallet"
      [value]="series().total"
      [state]="loading() ? 'loading' : 'ready'"
      [delta]="series().up === null ? '' : series().delta"
      [up]="series().up"
      [hint]="periodLabel()"
      [accent]="true"
      [index]="2"
    />
    @for (k of kpis(); track k.label; let i = $index) {
      <app-bento-stat-tile
        [label]="k.label"
        [icon]="i === 0 ? 'fa-solid fa-music' : 'fa-solid fa-download'"
        [value]="k.value"
        [state]="loading() ? 'loading' : 'ready'"
        [delta]="k.delta"
        [up]="k.up"
        [hint]="k.note"
        [link]="k.link"
        [index]="3 + i"
      />
    }

    <app-bento-card heading="Recent purchases" [span]="8" [spanMd]="12" [index]="6">
      <a cardActions class="more" routerLink="/studio/purchases">Open library →</a>
      <app-bento-feed
        [rows]="purchaseRows()"
        [empty]="loading() ? 'Loading…' : 'No purchases yet — find your first beat.'"
      />
    </app-bento-card>
  }

  <app-bento-card
    [heading]="role() === 'producer' ? 'Needs attention' : 'For you'"
    [span]="4"
    [spanMd]="6"
    [spanSm]="12"
    [index]="9"
  >
    <app-bento-feed
      [rows]="attentionRows()"
      [empty]="loading() ? 'Loading…' : 'You’re all caught up — nothing needs your attention.'"
      (act)="markRead($event)"
    />
  </app-bento-card>

  @if (role() === 'producer') {
    <app-bento-card heading="Recent orders" [span]="4" [spanMd]="6" [spanSm]="12" [index]="10">
      <a cardActions class="more" routerLink="/studio/orders">View all →</a>
      <app-bento-feed [rows]="orderRows()" empty="No orders yet." />
    </app-bento-card>
  }

  <app-bento-card
    heading="Recent activity"
    [span]="4"
    [spanMd]="role() === 'producer' ? 12 : 6"
    [spanSm]="12"
    [index]="11"
  >
    <app-bento-feed [rows]="activityRows()" empty="No recent activity." />
  </app-bento-card>

  <app-bento-card
    heading="Shortcuts"
    [span]="role() === 'producer' ? 12 : 4"
    [spanMd]="12"
    [index]="12"
  >
    <app-bento-feed [rows]="linkRows()" [columns]="role() === 'producer' ? 4 : 1" />
  </app-bento-card>
</app-bento-page>
