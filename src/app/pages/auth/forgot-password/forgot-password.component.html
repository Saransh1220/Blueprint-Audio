<section class="auth-flow-page" data-flow="forgot">
  <div class="auth-flow-shell">
    <aside class="auth-flow-visual">
      <img
        class="auth-flow-visual-img"
        src="/auth-hero.webp"
        alt=""
        width="1200"
        height="900"
        fetchpriority="high"
      />
      <div class="auth-flow-visual-shade" aria-hidden="true"></div>

      <a class="auth-flow-brand" routerLink="/" aria-label="Waveyard home">
        <img src="/logo-dark-cropped.png" alt="" />
        <span>Waveyard</span>
      </a>

      <div class="auth-flow-tagline">
        <p>Sounds<br />for what’s next.</p>
        <span class="auth-flow-tagline-rule" aria-hidden="true"></span>
        <small>Beats. Moods. Producers.</small>
      </div>
    </aside>

    <main class="auth-flow-panel">
      <div class="auth-flow-top">
        <a class="auth-flow-brand auth-flow-brand-mobile" routerLink="/" aria-label="Waveyard home">
          <img src="/logo-dark-cropped.png" alt="" />
          <span>Waveyard</span>
        </a>
        <p>Remembered it? <a routerLink="/login">Sign in</a></p>
      </div>

      <div class="auth-flow-main">
        <header class="auth-flow-heading">
          <h1>Recover your <span>access</span></h1>
          <p>Enter your Waveyard email and we will send the six-digit code for your reset screen.</p>
        </header>

        <form class="auth-flow-form" (ngSubmit)="onSubmit()" novalidate>
          <div class="auth-flow-group">
            <label for="forgot-email">Account email</label>
            <div class="auth-flow-input">
              <svg class="auth-flow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m3 7 9 6 9-6" />
              </svg>
              <input
                id="forgot-email"
                type="email"
                name="email"
                [(ngModel)]="email"
                placeholder="Account email"
                autocomplete="email"
                required
              />
            </div>
            <div class="auth-flow-meta">
              <span>we will send a 6-digit code</span>
              <span>required</span>
            </div>
          </div>

          <div class="auth-flow-actions">
            <button class="auth-flow-primary" type="submit" [disabled]="isSubmitting()">
              @if (isSubmitting()) {
                <app-loading-spinner size="18px" color="#fff" />
              } @else {
                <span>Send reset code</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M5 12h14" />
                  <path d="m12 5 7 7-7 7" />
                </svg>
              }
            </button>
          </div>
        </form>

        <div class="auth-flow-links">
          <a routerLink="/verify-email">Need to verify instead?</a>
          <a routerLink="/register">Create a new account</a>
        </div>
      </div>
    </main>
  </div>
</section>
