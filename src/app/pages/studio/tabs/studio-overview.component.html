<app-bento-page
  [heading]="'Good ' + greeting() + ', ' + firstName() + '.'"
  [subtitle]="statusLine()"
>
  <div bentoActions class="actions">
    <app-bento-segmented
      label="Revenue currency"
      [options]="currencyOptions()"
      [value]="producerCurrency()"
      (selected)="onCurrencySelected($event)"
    />
    <a class="upload" routerLink="../upload">
      <i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i> Upload beat
    </a>
  </div>

  <app-bento-insights
    variant="overview"
    [data]="analyticsData()"
    [state]="insightState()"
    [currency]="producerCurrency()"
    periodLabel="Last 30 days"
    [topSpecs]="topSpecs()"
    [artwork]="trackArtwork()"
    rankBy="plays"
    rankHint="By plays"
    gaugeHint="Share of revenue"
    tilesLink="../analytics"
    [animateKey]="producerCurrency()"
  >
    <app-bento-card
      sideCard
      heading="Recent sales"
      palette="blue"
      [span]="4"
      [spanMd]="12"
      [height]="376"
      [index]="1"
    >
      <a cardActions class="more" routerLink="../orders">All orders →</a>
      <div class="headline">
        <strong class="big">{{ saleRows().length }}</strong>
        <span class="unit">latest {{ saleRows().length === 1 ? 'sale' : 'sales' }}</span>
      </div>
      <app-bento-feed
        emptyIcon="fa-solid fa-receipt"
        [rows]="saleRows()"
        [empty]="
          isLoadingOrders() ? 'Loading sales…' : 'No sales yet. New orders will appear here.'
        "
      />
    </app-bento-card>
    <app-bento-card footCard heading="Jump to" palette="lime" [span]="12" [index]="8">
      <app-bento-feed [rows]="quickLinks" [columns]="4" />
    </app-bento-card>
  </app-bento-insights>
</app-bento-page>
