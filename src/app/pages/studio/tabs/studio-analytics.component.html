<app-bento-page
  heading="Analytics"
  [subtitle]="'Performance for the ' + rangeLabel() + '. Revenue shows paid sales.'"
>
  <div bentoActions class="actions">
    <app-bento-segmented
      label="Date range"
      [options]="periodOptions"
      [value]="periodValue()"
      (selected)="onPeriodSelected($event)"
    />
    <button class="export" type="button" [disabled]="!data()" (click)="exportCSV()">
      <i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i> Export CSV
    </button>
  </div>

  @if (error()) {
    <p class="notice" role="alert">{{ error() }}</p>
  }

  <app-bento-insights
    variant="analytics"
    [data]="data()"
    [state]="insightState()"
    [currency]="producerCurrency()"
    [periodLabel]="periodTitle()"
    [topSpecs]="topSpecs()"
    [artwork]="trackArtwork()"
    [rankBy]="sortBy()"
    [rankHint]="rankHint()"
    gaugeHint="Share of revenue"
    [animateKey]="currentDays() + ':' + producerCurrency()"
  >
    <app-bento-segmented
      rankActions
      label="Sort beats by"
      [emitSame]="true"
      [options]="sortOptions"
      [value]="sortBy()"
      (selected)="onSortSelected($event)"
    />
  </app-bento-insights>
</app-bento-page>
