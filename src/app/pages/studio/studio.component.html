<div class="studio-layout">
  <!-- Mobile sidebar backdrop -->
  <div class="sidebar-backdrop" [class.show]="isMobileNavOpen()" (click)="closeMobileNav()"></div>

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar" [class.open]="isMobileNavOpen()" aria-label="Studio navigation">
    <!-- Identity -->
    <a
      class="who"
      [routerLink]="profileLink()"
      (click)="closeMobileNav()"
      title="View public profile"
    >
      <span class="who-avatar">
        @if (avatarUrl()) {
          <img [src]="avatarUrl()" [alt]="displayName()" />
        } @else {
          {{ displayName().slice(0, 1) }}
        }
      </span>
      <span class="who-text">
        <span class="who-name">{{ displayName() }}</span>
        <span class="who-handle">&#64;{{ handle() }}</span>
      </span>
      <i class="fas fa-arrow-up-right-from-square who-go" aria-hidden="true"></i>
    </a>

    @if (currentUser()?.role === Role.PRODUCER) {
      <a class="upload-cta" routerLink="upload" (click)="closeMobileNav()">
        <i class="fas fa-plus" aria-hidden="true"></i>
        Upload beat
      </a>
    }

    <!-- Main nav -->
    <nav class="side-nav">
      <div class="side-label">Studio</div>
      @for (item of availableNavItems(); track item.route) {
        <a
          class="side-nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeMobileNav()"
        >
          <span class="sn-ico" [attr.data-tint]="item.tint">
            <i [class]="'fas ' + item.icon" aria-hidden="true"></i>
          </span>
          <span class="sn-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="side-bottom">
      <a class="side-bottom-link" routerLink="/" (click)="closeMobileNav()">
        <i class="fas fa-house" aria-hidden="true"></i> Back to site
      </a>
      <button type="button" class="side-bottom-link" (click)="logout()">
        <i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i> Sign out
      </button>
    </div>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="studio-main">
    <router-outlet />
  </main>
</div>
