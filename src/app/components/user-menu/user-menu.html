<div class="user-menu-wrap">
  <button
    #trigger
    type="button"
    class="trigger user-btn"
    [class.active]="open()"
    aria-label="Account menu"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? 'header-account' : null"
    (click)="toggle()"
  >
    <span class="avatar" [style.background-image]="avatarImage()">
      @if (!avatarImage()) {
        {{ initial() }}
      }
    </span>
    <i class="fas fa-chevron-down caret" aria-hidden="true"></i>
  </button>

  @if (open()) {
    <div class="panel" id="header-account">
      <header class="who">
        <span class="avatar large" [style.background-image]="avatarImage()">
          @if (!avatarImage()) {
            {{ initial() }}
          }
        </span>
        <span class="who-text">
          <strong class="name">{{ displayName() }}</strong>
          @if (handle()) {
            <span class="handle">&#64;{{ handle() }}</span>
          }
          <span class="role">
            {{ isProducer() ? 'Producer' : 'Listener' }}
          </span>
        </span>
      </header>

      <nav class="links" aria-label="Account">
        @for (link of links(); track link.route) {
          <a class="row" [routerLink]="link.route" (click)="close()">
            <span class="ico">
              <i class="fas" [class]="link.icon" aria-hidden="true"></i>
            </span>
            {{ link.label }}
            <i class="fas fa-arrow-right go" aria-hidden="true"></i>
          </a>
        }
      </nav>

      <footer class="foot">
        <button type="button" class="logout" (click)="logout()">
          <i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i>
          Log out
        </button>
      </footer>
    </div>
  }
</div>
