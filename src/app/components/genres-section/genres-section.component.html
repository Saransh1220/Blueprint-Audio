<section class="genres-section block">
  <div class="section-head">
    <div>
      <div class="section-num"><span class="dot"></span> 01 / Genres</div>
      <h2 class="section-h">pick a <em>flavor</em>, any flavor.</h2>
    </div>
    <div class="head-meta">
      <p>Find beats by genre.</p>
      <a class="arrow-link" routerLink="/explore"
        >See all genres
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </a>
    </div>
  </div>

  <div class="category-grid">
    <div
      class="cat-tile"
      role="link"
      tabindex="0"
      routerLink="/explore"
      [queryParams]="{ genres: 'Trap' }"
      (keydown.enter)="$any($event.target).click()"
    >
      <img
        class="cat-art"
        src="/assets/images/genres/trap.webp"
        alt=""
        width="600"
        height="901"
        loading="lazy"
        decoding="async"
      />
      <div class="cat-num">01</div>
      <div>
        <h3>Trap &amp; <em>Drill</em></h3>
      </div>
    </div>
    <div
      class="cat-tile"
      role="link"
      tabindex="0"
      routerLink="/explore"
      [queryParams]="{ genres: 'RnB' }"
      (keydown.enter)="$any($event.target).click()"

      <img
        class="cat-art"
        src="/assets/images/genres/rnb.webp"

        width="600"
        height="901"
        loading="lazy"
        decoding="async"
      />
      <div class="cat-num">02</div>
      <div>
        <h3>R&amp;B <em>Soul</em></h3>
      </div>
    </div>
    <div

      />

        <h3>Synth <em>Wave</em></h3>

    </div>
    <div
