<button type="button" (click)="openRequested.emit(pack().slug)">
  <span class="artwork" [attr.data-palette]="pack().artwork.palette"
    ><i class="fas fa-layer-group"></i
  ></span>
  <span class="copy"
    ><strong
      >{{ titleParts().before }}<em>{{ titleParts().accent }}</em
      >{{ titleParts().after }}</strong
    ><small>&#64;{{ pack().producer.handle }} · {{ pack().fileCount }} files</small></span
  >
  <span class="price">{{ priceLabel() }}</span>
</button>
