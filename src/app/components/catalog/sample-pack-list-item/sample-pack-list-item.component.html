<article class="row" (click)="openRequested.emit(pack().slug)">
  <div class="mini" [attr.data-palette]="pack().artwork.palette">
    <i class="fas fa-layer-group"></i>
  </div>
  <div class="identity">
    <h3>
      {{ titleParts().before }}<em>{{ titleParts().accent }}</em
      >{{ titleParts().after }}
    </h3>
    <p>&#64;{{ pack().producer.handle }} · {{ pack().genre }} · {{ sizeLabel() }}</p>
  </div>
  <span class="stat hide-mobile">{{ pack().fileCount }} files</span>
  <span class="stat hide-mobile">{{ pack().formats.join(' + ') }}</span>
  <span class="stat">{{ pack().engagement.downloadCount.toLocaleString() }} <em>dl</em></span>
  <span class="price" [class.free]="pack().price.amount_minor === 0">{{ priceLabel() }}</span>
  <button type="button" (click)="$event.stopPropagation(); openRequested.emit(pack().slug)">
    <i class="fas fa-arrow-right"></i>
  </button>
</article>
