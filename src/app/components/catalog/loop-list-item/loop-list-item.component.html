<article class="row" [class.playing]="playing()">
  <button type="button" class="play" (click)="playRequested.emit(loop().id)">
    <i class="fas" [class.fa-play]="!playing()" [class.fa-pause]="playing()"></i>
  </button>
  <div class="identity">
    <h3>
      {{ titleParts().before }}<em>{{ titleParts().accent }}</em
      >{{ titleParts().after }}
    </h3>
    <p>&#64;{{ loop().producer.handle }} · {{ typeLabel() }} · {{ durationLabel() }}</p>
  </div>
  <span class="stat hide-mobile">{{ loop().bpm }} bpm</span>
  <span class="stat hide-mobile">{{ loop().musicalKey ?? '—' }}</span>
  <span class="stat">{{ loop().engagement.downloadCount.toLocaleString() }} <em>dl</em></span>
  <span class="price" [class.free]="loop().price.amount_minor === 0">{{ priceLabel() }}</span>
  <div class="actions">
    <button type="button" [class.on]="wishlisted()" (click)="wishlistRequested.emit(loop().id)">
      <i class="fa-heart" [class.far]="!wishlisted()" [class.fas]="wishlisted()"></i>
    </button>
    <button type="button" (click)="acquireRequested.emit(loop())">
      <i class="fas fa-download"></i>
    </button>
  </div>
</article>
