<nav class="pagination" aria-label="Catalog pages">
  <span
    >Showing <strong>{{ start() }}–{{ end() }}</strong> of <strong>{{ totalItems() }}</strong></span
  >
  <div>
    <button type="button" [disabled]="page() === 1" (click)="selectPage(page() - 1)">← Prev</button>
    @for (item of pages(); track item) {
      <button type="button" [class.active]="item === page()" (click)="selectPage(item)">
        {{ item }}
      </button>
    }
    <button type="button" [disabled]="page() === totalPages()" (click)="selectPage(page() + 1)">
      Next →
    </button>
  </div>
</nav>
