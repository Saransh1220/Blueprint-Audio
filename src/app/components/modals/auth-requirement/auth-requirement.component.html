<section class="gate" aria-labelledby="gate-title">
  <img class="mark" src="/logo-dark-cropped.webp" alt="" />

  <h2 id="gate-title" class="title">Join {{ brand.name }}</h2>
  <p class="lede">Create a free account to like beats, fill your cart and check out.</p>

  <div class="actions">
    <button type="button" class="cta cta-solid" (click)="navigateToRegister()">
      Create account
    </button>
    <button type="button" class="cta cta-line" (click)="navigateToLogin()">
      I already have an account
    </button>
  </div>

  <ul class="perks">
    @for (perk of perks; track perk.label) {
      <li>
        <i class="fas" [class]="perk.icon" aria-hidden="true"></i>
        <span>{{ perk.label }}</span>
      </li>
    }
  </ul>

  <button type="button" class="later" (click)="dismiss()">Keep browsing</button>
</section>
