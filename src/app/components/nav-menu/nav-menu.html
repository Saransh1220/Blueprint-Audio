<nav class="panel" [attr.aria-label]="label()">
  <div class="inner">
    <h2 class="heading">{{ label() }}</h2>
    <div class="grid">
      @for (item of items(); track item.route) {
        <a
          class="item"
          [class.featured]="item.route === featuredRoute()"
          [routerLink]="item.route"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <span class="icon"><i class="fas" [class]="item.icon" aria-hidden="true"></i></span>
          <span class="text">
            <span class="name">{{ item.label }}</span>
            <span class="desc">{{ item.description }}</span>
          </span>
          <i class="fas fa-arrow-right go" aria-hidden="true"></i>
        </a>
      }
    </div>
  </div>
</nav>
