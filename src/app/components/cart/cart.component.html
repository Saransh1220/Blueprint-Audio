<main class="cart-page" [class.is-empty]="items().length === 0" aria-labelledby="cart-title">
  <div class="shell">
    @if (items().length === 0) {
      <app-cart-empty />
    } @else {
      <header class="head">
        <div>
          <h1 id="cart-title">Your cart</h1>
          <p>
            {{ items().length }} {{ items().length === 1 ? 'track' : 'tracks' }} from
            {{ producerCount }} {{ producerCount === 1 ? 'producer' : 'producers' }} · ready for
            instant download
          </p>
        </div>
        <button type="button" class="clear" (click)="clearCart()">Clear all</button>
      </header>

      <div class="layout">
        <section class="items" aria-label="Items in your cart">
          @for (item of items(); track item.id) {
            <app-cart-item [item]="item" (remove)="removeItem(item.id)" />
          }
          <a class="continue" routerLink="/explore">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
            Continue browsing
          </a>
        </section>

        <app-cart-summary
          class="summary"
          [itemCount]="items().length"
          [totalMoney]="totalMoney"
          [total]="total"
          [mixedCurrencies]="hasMixedCurrencies"
          (checkout)="checkout()"
        />
      </div>
    }
  </div>
</main>
